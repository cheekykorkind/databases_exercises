default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("RAILS_DB_HOST") { "dbe-db" } %>
  username: postgres
  password: postgres

development:
  <<: *default
  database: b_1_development

test:
  <<: *default
  database: b_1_test